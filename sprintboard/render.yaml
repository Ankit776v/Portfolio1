services:
  - type: web
    name: sprintboard
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: sprintboard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/sprintboard.sqlite
      - key: COOKIE_SECURE
        value: 'true'
      # Set PUBLIC_ORIGIN to the actual https://... on Render before launch.
