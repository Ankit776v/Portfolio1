services:
  - type: web
    name: movieshub
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
