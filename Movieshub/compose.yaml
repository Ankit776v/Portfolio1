services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:5000
      MONGODB_URI: mongodb://mongo:27017/movieshub
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in your shell}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    init: true
    restart: unless-stopped
  mongo:
    image: mongo:8
    volumes:
      - movieshub-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  movieshub-data:
